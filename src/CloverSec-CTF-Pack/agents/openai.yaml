interface:
  display_name: "CloverSec CTF Pack"
  short_description: "把 CTF 题目整理成能交付的题目包，恢复原题难度，并本地验证"
  default_prompt: "用 $cloversec-ctf-pack 处理当前题目：先反推原题难度并原样恢复，再整理成容器题或附件题交付包，写 README 手册，用 verify.sh 验证。"

# 顺序是「先查明白，再问剩下的」：先把题目目录、源码、Dockerfile、start.sh、
# 赛事归档、旧手册读一遍，能从材料里定下来的自己定（题目类型、交付形态、
# 要不要附件和镜像 tar、是不是 RDG、材料缺什么），不要拿这些去问用户。
# 只把真推不出来的拿来问：材料里没有的端口/启动命令/Flag 路径/运行时版本、
# 多个方案代价差很多、要改题目难度、打算降级处理。
# 提问时先说查到了什么再问缺口，给 2~4 个直白选项并标出推荐项，问完等回答再动手。
#
# 难度是默认动作，不是可选项：拿到题目先写难度基线（漏洞类型、链路、服务拓扑、
# 运行时版本），默认按原题恢复。合并服务层、升级运行时大版本、压缩链路、删防护
# 都算降级，必须先停下来问用户，不许拿"要不要保持现状"当选项。
# 出题人意愿优先：改判定结果、改交付物、在多个方案里选、删改已有内容、自己拿不准的，
# 动手前必须先问，说清"打算改什么、为什么、会影响什么"。作者说"无所谓"就保持现状，
# 不要过两轮又提一次。自己查得证的事实（代码、平台、文件）照旧自己查，别拿去问。
interaction:
  request_user_input: true
  ask_first: false
  guidance: "出题人意愿优先：这块是给作者打工的，不是替他做主。改判定结果、改交付物、在多个方案里选、删改已有内容、自己拿不准的，动手前先说清打算改什么、为什么、会影响什么，等确认再做；作者说无所谓就保持现状。自己查得证的事实照旧自己查，不要拿去问。难度的默认动作是反推并原样恢复，降级必须先问。完整规则见 SKILL.md 的「出题人意愿优先」「默认恢复原题难度」「先查明白，再问剩下的」。"
